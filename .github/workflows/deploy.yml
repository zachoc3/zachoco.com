name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub sign in to AWS with OIDC (no stored access keys)
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::655311368493:role/GitHubActionsZachocoDeployRole
  S3_BUCKET: zachoco
  CLOUDFRONT_DISTRIBUTION_ID: E13ZSBIKZY30W0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-zachoco-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Mirrors the repo into the bucket: files not in the repo are removed from the bucket.
      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://$S3_BUCKET" --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --cache-control "max-age=300,public"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
